[project]
name = "stac-viewer"
version = "0.1.0"
description = "Browse STAC catalogs in notebooks: dot-notation collections, HTML viewers, bbox/date selector and search"
readme = "README.md"
authors = [
    { name = "lukegre", email = "lukegre@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "odc-stac>=0.5.3",
    "pystac>=1.10",
    "pystac-client>=0.8",
]

[project.optional-dependencies]
widget = ["anywidget>=0.9"]
cog = [
    "odc-stac>=0.3.10",
    "xarray>=2024.1",
]
zarr = [
    "fsspec>=2023.1",
    "xarray>=2024.1",
    "xpystac>=0.2",
    "zarr>=2.16",
]
netcdf = [
    "fsspec>=2023.1",
    "h5netcdf>=1.3",
    "xarray>=2024.1",
    "xpystac>=0.2",
]
parquet = [
    "geopandas>=0.14",
    "pyarrow>=14",
]
open = ["stac-viewer[cog,zarr,netcdf,parquet]"]

[dependency-groups]
dev = [
    "pytest",
    "anywidget",
    "ipykernel",
    "nbclient",
    "nbformat",
    "planetary-computer",
    "rasterio",
    "rioxarray",
    "dask",
    "h5py",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
