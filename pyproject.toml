[project]
name = "stac-viewer"
version = "0.1.0"
description = "Browse STAC catalogs in notebooks: dot-notation collections, HTML viewers, bbox/date selector and search"
readme = "README.md"
authors = [
    { name = "lukegre", email = "lukegre@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "adlfs>=2026.8.0",
    "anywidget>=0.9",
    "odc-stac>=0.5.3",
    "openpyxl>=3.1.5",
    "pystac>=1.10",
    "pystac-client>=0.8",
]

[project.optional-dependencies]
cog = [
    "odc-stac>=0.3.10",
    "xarray>=2024.1",
]
zarr = [
    "cftime>=1.6",
    "fsspec>=2023.1",
    "xarray>=2024.1",
    "xpystac>=0.2",
    "zarr>=2.16",
]
netcdf = [
    "cftime>=1.6",
    "fsspec>=2023.1",
    "h5netcdf>=1.3",
    "xarray>=2024.1",
    "xpystac>=0.2",
]
parquet = [
    "geopandas>=0.14",
    "pyarrow>=14",
]
gdb = [
    "geopandas>=0.14",
    "pyogrio>=0.7",
]
csv = [
    "geopandas>=0.14",
]
open = ["stac-viewer[cog,zarr,netcdf,parquet,gdb,csv]"]
vis = [
    "matplotlib>=3.10.9",
    "folium>=0.20.0",
    "mapclassify>=2.8.1",
    "xyzservices>=2026.9.1",
]

[dependency-groups]
dev = [
    "stac-viewer[open,vis]",
    "pytest",
    "ipykernel",
    "nbclient",
    "nbformat",
    "planetary-computer",
    "rasterio",
    "rioxarray",
    "dask",
    "h5py",
    "marimo",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
